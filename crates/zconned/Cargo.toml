[package]
name = "zconned"
version = "0.1.0-alpha"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "zconned"
path = "src/bin/zconned/main.rs"

[dependencies]
protobuf-varint-deframer.workspace = true
zconned-stdio-types.workspace = true
zconned-io-link.workspace = true
base64.workspace = true
zconned-codec.workspace = true
zconned-material.workspace = true
zconned-crypto.workspace = true
zconnor-mail-types.workspace = true
pbjson-types = "0.9.0"
getrandom.workspace = true
dirs.workspace = true
time.workspace = true
serde_json.workspace = true

# bin-only deps (clap/env_logger/miette): publish = false, see the
# publish-plan standing item before any release.
log.workspace = true
tap.workspace = true
thiserror.workspace = true
miette.workspace = true
clap.workspace = true
clap-verbosity-flag.workspace = true
env_logger.workspace = true
typed-builder.workspace = true
getset.workspace = true
bytes.workspace = true
prost.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "io-std",
  "macros",
  "rt",
  "time",
] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
zconned-io-link.workspace = true
