[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["celet-ff-io"]
edition = "2024"
homepage = "https://github.com/celet-ff-io/zconn/"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/celet-ff-io/zconn/"
rust-version = "1.98"

[workspace.dependencies]
protobuf-varint-deframer = { path = "crates/protobuf-varint-deframer" }
zconned-types = { path = "crates/zconned-types" }
zconned-io-link = { path = "crates/zconned-io-link" }
zconned-crypto = { path = "crates/zconned-crypto" }
zconned-codec = { path = "crates/zconned-codec" }

ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha3 = "0.10"
sha3-kmac = "0.3"
base64 = "0.22"
dirs = "6"
serde_json = "1.0.151"
zeroize = "1.8"

tap = "1.0.1"
thiserror = "2.0.21"
miette = { version = "7.6.0", features = ["fancy"] }
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
typed-builder = "0.23.2"
getset = "0.1.7"
bytes = "1.12.1"
tokio = "1.53.2"
log = "0.4.28"
env_logger = "0.11.8"
clap = { version = "4.6.1", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
serde = "1.0.229"
prost = "0.14.4"
