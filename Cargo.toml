[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["celet-ff-io"]
edition = "2024"
homepage = "https://github.com/celet-ff-io/zconn/"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/celet-ff-io/zconn/"
rust-version = "1.98"

[workspace.dependencies]
zconned-types = { path = "crates/zconned-types" }

thiserror = "2.0.20"
tap = "1.0.1"
miette = { version = "7.6.0", features = ["fancy"] }
