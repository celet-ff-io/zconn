[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["celet-ff-io"]
edition = "2024"
homepage = "https://github.com/celet-ff-io/zconn/"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/celet-ff-io/zconn/"
rust-version = "1.98"

[workspace.dependencies]
zconned = { path = "crates/zconned" }
zconned-types = { path = "crates/zconned-types" }

tap = "1.0.1"
thiserror = "2.0.20"
miette = { version = "7.6.0", features = ["fancy"] }
pretty_assertions = "1.4.1"
typed-builder = "0.23.2"
getset = "0.1.7"
bytes = "1.12.1"
prost = "0.14.4"
