[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["celet-ff-io"]
edition = "2024"
homepage = "https://github.com/celet-ff-io/zconn/"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/celet-ff-io/zconn/"
rust-version = "1.98"

[workspace.dependencies]
protobuf-varint-deframer = { path = "crates/protobuf-varint-deframer" }
zconned-stdio-types = { path = "crates/zconned-stdio-types" }
zconned-material = { path = "crates/zconned-material" }
zconned-io-link = { path = "crates/zconned-io-link" }
zconned-crypto = { path = "crates/zconned-crypto" }
zconned-codec = { path = "crates/zconned-codec" }

ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
getrandom = "0.4.3"
sha3 = "0.10.8"
sha3-kmac = "0.3.0"
base64 = "0.23.1"
dirs = "7.0.0"
serde_json = "1.0.154"
time = { version = "0.3", features = ["formatting", "parsing", "std"] }
zeroize = "1.9.1"

tap = "1.0.1"
thiserror = "2.0.21"
miette = { version = "7.6.0", features = ["fancy"] }
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
typed-builder = "0.23.2"
getset = "0.1.7"
bytes = "1.12.1"
tokio = "1.54.1"
log = "0.4.35"
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
serde = "1.0.229"
prost = "0.14.4"
